name: Publish GlowQuest beta APK

# Publish only when the full Android CI workflow (including emulator tests) succeeds.
# Never release builds from pull requests or untrusted forks.
on:
  workflow_run:
    workflows: ["Build GlowQuest Android APK"]
    types: [completed]
  # One-time bootstrap from a previously fully successful CI build.
  push:
    paths: ['.github/workflows/publish-beta-release.yml']

permissions:
  contents: read

jobs:
  publish:
    name: Publish sideloadable beta release
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main' &&
           github.event.head_commit.message == 'Bootstrap GlowQuest beta release from verified CI') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested APK from successful workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || 42825443997 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name GlowQuest-debug-APK --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/GlowQuest-BandLab-v2.3.1-beta.1.apk
          sha256sum release/GlowQuest-BandLab-v2.3.1-beta.1.apk | tee release/SHA256SUMS.txt

      - name: Publish beta release (only once for this version)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.3.1-beta.1
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || '1e1e9086b28b34bdbf74dce0cfc0d627674b7f11' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing an existing APK."
            exit 0
          fi

          cat > release/RELEASE_NOTES.md <<'NOTES'
          # GlowQuest — Band Lab 2.3.1 (Beta 1)

          **Sideloadable Android APK for MagicBand+ experiments.**

          This early-access build includes the colorful kid-friendly interface,
          Includes all previous 60-second Fireworks, Walk-by Glow and
          Effect Studio features. Removes the "Did it work?" prompt/history.
          Band Scout now includes a 20-second, unfiltered BLE scan, device/
          advertisement counters and optional show-all diagnostic mode.
          Android 6-11 location-services prerequisites are clearly reported.
          Scanning remains local and does not pair or control individual bands.

          Scout does not pair, bond or individually address bands. A manual
          serial odd/even color assignment is a preview, not a direct command.

          **How to install on your Android phone**
          1. Download the `GlowQuest-BandLab-v2.3.1-beta.1.apk` asset below.
          2. Open it from Files/Downloads and allow installation from that source if prompted.
          3. Launch GlowQuest, enable Bluetooth and grant Nearby devices permission.
          4. Try with your own MagicBand+ away from other guests.

          **Beta limitations**
          - This is a *debug-signed* test build, not a production-signed release.
          - GitHub runner debug signing keys may differ between builds. You may
            need to uninstall an older debug build before installing an update;
            uninstalling removes local progress.
          - Automated Gherkin, screenshot, and Android emulator tests passed,
            but MagicBand+ radio responses still need physical-device validation.
          - BLE advertisements are broadcasts: nearby bands can receive them.
          - Fireworks are foreground-only and cancel/auto-stop; radio reception,
            vibration timing and LED animations vary across bands.
          - The walk-by sequence is a fixed timing demo, not proximity sensing.
          - Scout discovers candidate FE03 advertisements only. Neither
            Fireworks nor Walk-by can address three bands separately.
          - Not affiliated with or endorsed by Disney.
          NOTES

          gh release create "$RELEASE_TAG" \
            "release/GlowQuest-BandLab-v2.3.1-beta.1.apk" \
            "release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "GlowQuest Band Lab v2.3.1 — Beta 1" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease

          echo "## GlowQuest beta release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Install APK directly from the release Assets section." >> "$GITHUB_STEP_SUMMARY"
