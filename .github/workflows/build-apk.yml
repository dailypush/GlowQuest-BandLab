name: Build GlowQuest Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/build-apk.yml', 'app/**', 'features/**', 'tests/**', '.github/workflows/publish-beta-release.yml', 'package.json', 'build.gradle', 'settings.gradle', 'gradle.properties']
  push:
    paths: ['.github/workflows/build-apk.yml', 'app/**', 'features/**', 'tests/**', '.github/workflows/publish-beta-release.yml', 'package.json', 'build.gradle', 'settings.gradle', 'gradle.properties']
permissions:
  contents: read
jobs:
  ui-acceptance:
    name: Gherkin scenarios + screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Cucumber and Playwright
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium for screenshot tests
        run: timeout 180s npx playwright install --only-shell chromium
      - name: Run Gherkin acceptance tests
        run: |
          mkdir -p reports/screenshots
          npm run test:ui
      - name: Compare screens with reviewed visual baselines
        shell: bash
        run: |
          python3 -m venv /tmp/glowquest-visual
          /tmp/glowquest-visual/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/glowquest-visual/bin/python tests/check_visual_regression.py
      - name: Upload visual regression heatmaps
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-visual-diffs
          path: reports/visual-diffs/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload README previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-README-previews
          path: reports/readme-previews/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload screenshots (including failures)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-UI-screenshots
          path: reports/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-Gherkin-reports
          path: |
            reports/cucumber.html
            reports/cucumber.json
          if-no-files-found: warn
          retention-days: 30
      - name: Add test summary
        if: always()
        shell: bash
        run: |
          echo '## GlowQuest UI tests' >> "$GITHUB_STEP_SUMMARY"
          if test -f reports/cucumber.json; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const features = JSON.parse(fs.readFileSync('reports/cucumber.json','utf8'));
          const scenarios = features.flatMap(f=>f.elements||[]).filter(s=>s.type==='scenario');
          const failed = scenarios.filter(s=>(s.steps||[]).some(x=>x.result?.status==='failed'));
          console.log('**'+(scenarios.length-failed.length)+'/'+scenarios.length+' scenarios passed.**');
          console.log('Download the screenshots and Cucumber HTML reports in the run artifacts.');
          NODE
          else
            echo 'No report available; see the setup logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build-debug-apk:
    name: Android APK (after Gherkin tests)
    needs: ui-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.9'
      - name: Build sideloadable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-screenshots:
    name: Android emulator WebView screenshots
    needs: build-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the built APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: GlowQuest-debug-APK
          path: reports/build-apk
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and capture app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tests/capture_android_emulator.py reports/build-apk/app-debug.apk
      - name: Upload Android emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowQuest-Android-emulator-screenshots
          path: reports/android-emulator/*.png
          if-no-files-found: warn
          retention-days: 30

  publish-readme-screenshots:
    name: Update README interface previews
    needs: [ui-acceptance, emulator-screenshots]
    # Never write assets from a PR or a fork; keep screenshot content from
    # the fully tested main branch only.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download screenshots from the tested UI run
        uses: actions/download-artifact@v8.0.2
        with:
          name: GlowQuest-README-previews
          path: reports/readme-previews
      - name: Optimize stable README WebP screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/glowquest-doc-images
          /tmp/glowquest-doc-images/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/glowquest-doc-images/bin/python tests/prepare_readme_images.py
      - name: Commit updated screenshot gallery to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main advanced since this build; skipping outdated gallery."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if git diff --cached --quiet; then
            echo "README screenshots have not changed."
          else
            git commit -m 'docs: refresh generated interface screenshots [skip ci]'
            git push origin HEAD:main
            echo '## README gallery refreshed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Optimized previews are committed in docs/screenshots/.' >> "$GITHUB_STEP_SUMMARY"
          fi
